name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_PUSHER_KEY: ${{ secrets.NEXT_PUBLIC_PUSHER_KEY }}
      NEXT_PUBLIC_PUSHER_CLUSTER: ${{ secrets.NEXT_PUBLIC_PUSHER_CLUSTER }}
      NEXT_PUBLIC_SOKETI_HOST: ${{ secrets.NEXT_PUBLIC_SOKETI_HOST }}
      NEXT_PUBLIC_SOKETI_PORT: ${{ secrets.NEXT_PUBLIC_SOKETI_PORT }}
      NEXT_PUBLIC_SOKETI_TLS: ${{ secrets.NEXT_PUBLIC_SOKETI_TLS }}
      NEXT_PUBLIC_SOKETI_PATH: ${{ secrets.NEXT_PUBLIC_SOKETI_PATH }}
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
      NEXT_PUBLIC_UPLOAD_PRESET: ${{ secrets.NEXT_PUBLIC_UPLOAD_PRESET }}

    steps:
      - name: Repository Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Cache Build Files
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Install Dependencies
        run: pnpm install

      - name: Build Project
        run: pnpm build

      - name: Sync Files to VPS
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avzr --delete --exclude '.git*' --exclude 'node_modules' --exclude '.github' --exclude '*.env'
          path: .
          remote_path: ${{ vars.PROJECT_PATH }}
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USERNAME }}
          remote_key: ${{ secrets.VPS_DEPLOY_KEY }}
          remote_port: ${{ vars.VPS_PORT }}

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_DEPLOY_KEY }}
          port: ${{ vars.VPS_PORT }}
          script: |
            echo "🔧 Loading NVM..."
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            echo "📁 Navigating to project directory..."
            cd ${{ vars.PROJECT_PATH }}

            echo "🧹 Installing --prod dependencies..."
            pnpm install --prod --ignore-scripts

            echo "🧠 Generating Prisma client for prod server..."
            pnpm prisma generate

            echo "🔐 Applying execute permissions to Prisma engine..."
            chmod +x ./src/generated/client/libquery_engine-debian-openssl-3.0.x.so.node

            echo "🗄️ Running database migrations..."
            pnpm prisma:deploy

            echo "🔄 Reloading application..."
            pm2 restart ${{ vars.PM2_APP_NAME }}

            echo "✅ Deployment finished."
